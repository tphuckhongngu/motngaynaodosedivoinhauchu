<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>một ngày nào đó có lẽ sẽ đi với nhau...</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght=600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #ffdde1, #ffb199);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #particles-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            bottom: -50px;
            opacity: 0;
            animation: floatUp ease-in forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0) scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-120vh) translateX(var(--sway)) scale(1.5) rotate(var(--rot)); opacity: 0; }
        }

        /* --- CSS Mới cho Hiệu ứng nổ tim --- */
        .burst-particle {
            position: fixed;
            top: 50%;
            left: 50%;
            pointer-events: none;
            animation: explode 1s ease-out forwards;
            z-index: 100;
        }

        @keyframes explode {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; }
        }
        /* ---------------------------------- */

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            z-index: 10;
            width: 90%; 
            max-width: 500px;
            transition: opacity 0.5s ease; /* Thêm hiệu ứng chuyển mượt */
        }

        img {
            width: 180px; 
            margin-bottom: 20px;
            animation: bounce 2s infinite ease-in-out;
            filter: drop-shadow(0px 8px 12px rgba(255, 77, 77, 0.2)); 
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        h1 {
            color: #ff4d4d;
            font-size: 36px;
            margin: 0 0 35px 0;
            text-shadow: 2px 2px 0px #ffffff, 4px 4px 10px rgba(255, 77, 77, 0.3);
            line-height: 1.3;
        }

        .success-text {
            font-size: 38px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
            height: 60px; 
            position: relative;
        }

        button {
            padding: 14px 30px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Quicksand', sans-serif;
            transition: all 0.3s ease;
        }

        #btn-yes {
            background-color: #ff4d4d;
            color: white;
            box-shadow: 0 8px 20px rgba(255, 77, 77, 0.5);
            z-index: 15;
        }

        #btn-yes:hover {
            background-color: #e60000;
            transform: scale(1.1) translateY(-3px);
        }

        #btn-no {
            background-color: #ffffff;
            color: #666666;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 600px) {
            h1 { font-size: 28px; }
            img { width: 150px; }
            button { padding: 12px 25px; font-size: 16px; }
        }
    </style>
</head>
<body>

    <audio id="mySong" loop>
        <source src="nhac2.mp3" type="audio/mpeg">
    </audio>

    <div id="particles-container"></div>

    <div class="container" id="content">
        <img src="gif1.gif" alt="Cute">
        <h1 id="question">bạn ơi, mai cậu đi ăn phở với mình nhé?</h1>
        <div class="buttons">
            <button id="btn-yes">Đồng ý ❤️</button>
            <button id="btn-no">Khum bao giờ</button>
        </div>
    </div>

    <script>
        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        const content = document.getElementById('content');
        const particlesContainer = document.getElementById('particles-container');
        const audio = document.getElementById('mySong');

        let yesSize = 18; 
        let yesPaddingX = 30;
        let yesPaddingY = 14;

        // Logic né nút
        const moveBtnNo = () => {
            const windowWidth = window.innerWidth - btnNo.offsetWidth;
            const windowHeight = window.innerHeight - btnNo.offsetHeight;
            btnNo.style.position = 'fixed';
            btnNo.style.left = `${Math.random() * windowWidth}px`;
            btnNo.style.top = `${Math.random() * windowHeight}px`;

            yesSize += 4;
            btnYes.style.fontSize = `${yesSize}px`;
            btnYes.style.padding = `${yesPaddingY + 2}px ${yesPaddingX + 5}px`;
        };

        btnNo.addEventListener('mouseover', moveBtnNo);
        btnNo.addEventListener('touchstart', moveBtnNo);

        // Hiệu ứng particle cơ bản
        function createParticle(isInitial = false) {
            const p = document.createElement('div');
            p.classList.add('particle');
            p.innerHTML = ['❤️', '🫧', '✨', '🌸', '💖'][Math.floor(Math.random() * 5)];
            p.style.left = `${Math.random() * 100}%`;
            p.style.fontSize = `${Math.random() * 20 + 15}px`;
            p.style.setProperty('--sway', `${(Math.random() - 0.5) * 150}px`);
            p.style.setProperty('--rot', `${(Math.random() - 0.5) * 200}deg`);
            p.style.animationDuration = `${Math.random() * 5 + 4}s`;
            
            // Nếu là hạt tạo ra lúc đầu, cho animation chạy lùi thời gian 
            // để chúng lấp đầy màn hình ngay lập tức thay vì phải chờ bay từ dưới lên
            if (isInitial) {
                p.style.animationDelay = `-${Math.random() * 5}s`;
            }

            particlesContainer.appendChild(p);
            setTimeout(() => p.remove(), 9000);
        }

        // Tạo sẵn một loạt hạt ngay khi load trang
        for(let i = 0; i < 40; i++) {
            createParticle(true);
        }
        let particleInterval = setInterval(() => createParticle(false), 400);

        // Hiệu ứng nổ pháo hoa tim khi bấm đồng ý
        function createBurst() {
            for(let i = 0; i < 60; i++) {
                const p = document.createElement('div');
                p.classList.add('burst-particle');
                p.innerHTML = ['❤️', '💖', '💗', '💓', '🥰'][Math.floor(Math.random() * 5)];
                p.style.fontSize = `${Math.random() * 25 + 15}px`;
                
                // Toán học để tim bay tỏa tròn
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 400 + 50; 
                p.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                p.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
                
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1000);
            }
        }

        // Bấm đồng ý
        btnYes.addEventListener('click', () => {
            audio.play().catch(e => console.log("Cần tương tác để phát nhạc"));
            
            // 1. Bắn pháo hoa tim
            createBurst();

            // 2. Làm mờ nội dung hiện tại
            content.style.opacity = '0';
            
            // 3. Đổi nội dung và làm rõ lại sau 0.4s
            setTimeout(() => {
                content.innerHTML = `
                    <img src="gif2.gif" style="width: 200px;">
                    <h1 class="success-text">Tớ biết mà! cảm ơn cậu nhiềuuuu ❤️</h1>
                `;
                content.style.opacity = '1';
            }, 400);
            
            // Tăng tốc độ bay của bong bóng nền
            clearInterval(particleInterval);
            particleInterval = setInterval(() => createParticle(false), 150);
        });
    </script>
</body>
</html>
